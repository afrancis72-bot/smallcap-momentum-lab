name: Research engine tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: python -m pip install pandas pytest
      - name: Compile all Python modules
        run: python -m compileall -q app.py alpaca_feed.py research_engine.py tests
      - name: Run deterministic tests
        run: python -m pytest -q
