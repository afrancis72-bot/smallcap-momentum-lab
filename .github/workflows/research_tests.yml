name: Research engine tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: python -m pip install 'pandas>=2.1,<3' 'requests>=2.31,<3' 'pytest>=8,<10' 'websocket-client>=1.8,<2'
      - name: Compile all Python modules
        run: python -m compileall -q app.py alpaca_feed.py live_sip.py research_engine.py tests
      - name: Run deterministic tests
        run: python -m pytest -q
